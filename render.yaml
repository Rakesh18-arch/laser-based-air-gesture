services:
  - type: web
    name: airwrite-cloud-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AIRWRITE_ADMIN_EMAIL
        sync: false
      - key: AIRWRITE_ADMIN_PASSWORD
        sync: false
      - key: AIRWRITE_ALLOWED_ORIGINS
        value: https://laserhandgesture.netlify.app
